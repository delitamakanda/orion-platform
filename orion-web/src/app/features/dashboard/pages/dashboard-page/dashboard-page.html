<app-page-header title="Dashboard" subtitle="Overview"></app-page-header>
@if (store.isLoading()) {
    <p>Loading...</p>
}

@if (store.error()) {
    <p>Error: {{ store.error() }}</p>
}

@if (store.latest()) {
    <p>Latest: {{ store.latest() | json }}</p>
}

@if (store.dashboards()) {
    <p>Dashboards: {{ store.dashboards() | json }}</p>
}

@if (store.kpis()) {
    <p>Kpis: {{ store.kpis() | json }}</p>
}
