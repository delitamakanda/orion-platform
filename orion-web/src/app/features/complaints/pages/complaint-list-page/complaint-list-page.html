<app-complaint-filters (filterChange)="updateFilters($event)"></app-complaint-filters>

@if (store.isLoading()) {
    <p>Loading complaints...</p>
}

@if (store.error()) {
    <p>Error: {{ store.error() }}</p>
}

@if (store.complaints().length > 0) {
    @for (complaint of store.complaints(); track complaint.id) {
        <app-complaint-card [complaint]="complaint" (click)="store.selectComplaint(complaint.id)"></app-complaint-card>
    }
}
