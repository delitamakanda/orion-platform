@if (store.isLoading()) {
    <p>Loading complaints...</p>
}

@if (store.error()) {
    <p>Error: {{ store.error() }}</p>
}

@if (store.complaints().length > 0) {
    @for (complaint of store.complaints(); track complaint.id) {
        <div class="complaint-item" (click)="store.selectComplaint(complaint.id)">
            <h3>{{ complaint.title }}</h3>
            <p>{{ complaint.description }}</p>
            <p>Status: {{ complaint.status }}</p>
        </div>
    }
}
