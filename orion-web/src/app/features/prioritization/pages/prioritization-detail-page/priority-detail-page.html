<app-ai-assessement-panel [assessment]="store.selectedAssessment()!"></app-ai-assessement-panel>
<app-priority-badge [priority]="store.selectedAssessment()?.level"></app-priority-badge>
<app-priority-factor-list [factors]="store.selectedAssessment()?.explanation!"></app-priority-factor-list>
<app-review-decision-form
  [assessmentId]="store.selectedAssessment()?.id"
  [suggestedLevel]="store.selectedAssessment()?.level"
  [suggestedScore]="store.selectedAssessment()?.score"
  (submitDecision)="handleSubmitDecision($event)"
></app-review-decision-form>
