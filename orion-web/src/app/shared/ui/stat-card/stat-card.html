<mat-card class="h-full rounded-2xl! border border-slate-100 shadow-xs! hover:shadow-md! transition-shadow duration-200">
  <div class="flex items-start justify-between gap-3 p-5">
    <div class="min-w-0 flex-1">
      <p class="truncate text-xs font-semibold uppercase tracking-widest text-slate-400">{{ title() }}</p>
      <p class="mt-2 text-3xl font-bold tracking-tight text-slate-800">{{ value() ?? '—' }}</p>
    </div>
    <div [class]="iconWrapperClass()">
      <mat-icon aria-hidden="true" class="text-xl!">{{ icon() }}</mat-icon>
    </div>
  </div>
</mat-card>
