<span class="inline-block px-2 py-1 text-sm font-semibold rounded-lg" [class]="{
    'bg-gray-100 text-gray-800': priority() === 'low',
    'bg-yellow-100 text-yellow-800': priority() === 'medium',
    'bg-green-100 text-green-800': priority() === 'high',
    'bg-red-100 text-red-800': priority() === 'critical'
  }">
  {{ priority() | titlecase}}
</span>
