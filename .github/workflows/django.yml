name: orion-api

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lancé par l'agent sur ses branches (une PR créée avec GITHUB_TOKEN ne déclenche pas `pull_request`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./orion-api
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.14]
    env:
      SECRET_KEY: ci-insecure-key
      DEBUG: 'True'
      PRIORITIZATION_PROVIDER: mock

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement-dev.txt
    - name: Django check
      run: python manage.py check
    - name: Migrations à jour
      run: python manage.py makemigrations --check --dry-run
    - name: Run Tests
      run: |
        python manage.py test
