# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: orion-web

on:
  push:
    branches: [ "main" ]
    paths:
      - 'orion-web/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'orion-web/**'
  # Lancé par l'agent sur ses branches (une PR créée avec GITHUB_TOKEN ne déclenche pas `pull_request`).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./orion-web

    strategy:
      matrix:
        node-version: [24.15.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./orion-web/package-lock.json
    - run: npm ci
      env:
        HUSKY: '0'
    - run: npx ng lint
    - run: npm run build --if-present
    - run: npm test
    - name: Format (fichiers modifiés)
      if: github.ref != 'refs/heads/main'
      working-directory: .
      run: bash scripts/agent/format-changed.sh --check
